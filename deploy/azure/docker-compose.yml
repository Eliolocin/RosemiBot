name: tomoribot-azure

services:
  tomoribot:
    image: ${TOMORIBOT_IMAGE:?TOMORIBOT_IMAGE is required}
    user: "1001:1001"
    init: true
    restart: unless-stopped
    read_only: true
    # Reserve RAM on the 4 GiB host for Docker, sidecars, and zram so the RSS guard remains reachable.
    mem_limit: "${TOMORIBOT_MEMORY_LIMIT_MB:-2048}m"
    # Total memory+swap, so swap.max is this minus mem_limit. Must be set explicitly: Docker
    # otherwise derives it as 2x mem_limit, which capped swap at 512 MB and saturated it within
    # 8 minutes of every boot. A cgroup at memory.swap.max cannot swap to ANY tier, so the host's
    # 3 GB disk swapfile sat at 0B used while the container suffocated beside it, leaving the
    # kernel nothing to reclaim but program text, which is the read-storm livelock this host hit.
    # Keep above the zram device's 1 GB so the overflow actually reaches disk.
    memswap_limit: "${TOMORIBOT_MEMORY_SWAP_LIMIT_MB:-3584}m"
    pids_limit: ${TOMORIBOT_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      RUN_ENV: production
      PORT: "8081"
      SECRET_FILE: /run/secrets/tomoribot.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-vertex-wif.json
      # Must track mem_limit above so the app sheds load before the cgroup OOM-kills it.
      CONTAINER_MEMORY_LIMIT_MB: "${TOMORIBOT_MEMORY_LIMIT_MB:-2048}"
      DATABASE_SCHEMA_MANAGEMENT_ENABLED: "false"
      FETCH_URL_ALLOW_PRIVATE_NETWORK: "false"
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      # Mirror production JSON logs (errors and metric samples at the default LOG_LEVEL) to an append-only JSONL file
      # tailed by Azure Monitor Agent on the host (see bind mount below).
      TOMORI_LOG_FILE: /app/logs/tomoribot.jsonl
      # Heap dumps contain live secrets, so diagnostics require explicit enablement outside log shipping.
      HEAP_SNAPSHOT_DIR: ${TOMORIBOT_HEAP_SNAPSHOT_DIR:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - /etc/tomoribot/secrets.json:/run/secrets/tomoribot.json:ro
      - /etc/tomoribot/google-vertex-wif.json:/run/secrets/google-vertex-wif.json:ro
      # Host directory is created by the deploy workflow with UID/GID 1001 (container
      # user "tomori") before compose starts; masks the image's /app/logs at runtime.
      - /var/log/tomoribot:/app/logs
      - /var/lib/tomoribot/diagnostics:/app/diagnostics
      - /var/lib/tomoribot/backups:/app/backups
      - /var/lib/tomoribot/data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=1001,gid=1001,mode=1777
      - /home/tomori/.cache:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=0700
      - /home/tomori/.bun:rw,noexec,nosuid,nodev,size=128m,uid=1001,gid=1001,mode=0700
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812}
    profiles:
      - searxng
    restart: unless-stopped
    read_only: true
    mem_limit: "${SEARXNG_MEMORY_LIMIT_MB:-384}m"
    pids_limit: ${SEARXNG_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://localhost:8080/
      # This image serves through Granian, not uWSGI, so uWSGI-style knobs are silently
      # ignored. Granian already defaults to one worker.
      #
      # A worker's heap is a high-water mark: Python returns freed objects to its own arenas
      # rather than the OS, so peak concurrency sets the resident size and it never falls back.
      # Measured on a 2-vCPU box, idle is ~135 MiB and heavy mixed-category load walks it past
      # `mem_limit`, where the cgroup OOM-kills the container. Respawning the worker at a
      # ceiling turns that into a brief in-process recycle instead. Keep this comfortably under
      # `SEARXNG_MEMORY_LIMIT_MB`: the master and interpreter sit outside the worker's RSS.
      GRANIAN_WORKERS_MAX_RSS: ${SEARXNG_WORKER_MAX_RSS_MB:-300}
      GRANIAN_RSS_SAMPLE_INTERVAL: ${SEARXNG_RSS_SAMPLE_INTERVAL:-10s}
      # Two WSGI request threads let a health probe run alongside one slow search, which fans out to engines internally.
      GRANIAN_BLOCKING_THREADS: ${SEARXNG_BLOCKING_THREADS:-2}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /etc/searxng:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
