name: "Issue: Self-Assign (/assign-me)"

on:
  issue_comment:
    types: [created]

jobs:
  assign:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign commenter
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const body = context.payload.comment.body.trim();
            if (body !== "/assign-me") return;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;
            const issue = context.payload.issue;

            if (issue.state === "closed") {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${commenter} This issue is closed and cannot be assigned.`,
              });
              return;
            }

            const alreadyAssigned = issue.assignees.find(
              (a) => a.login !== commenter,
            );
            if (alreadyAssigned) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${commenter} This issue is already assigned to @${alreadyAssigned.login}.`,
              });
              return;
            }

            await github.rest.issues.addAssignees({
              owner, repo, issue_number,
              assignees: [commenter],
            });
            // Assigning fires the `issues: assigned` event, which
            // project-issue-status.yml handles moving the card to In-Progress.
            // That status transition is intentionally owned solely by that
            // workflow so it also covers manual assignments via the GitHub UI.
