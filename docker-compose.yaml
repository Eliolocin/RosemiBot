services:
  # TomoriBot's PostgreSQL database - her private storage room
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: tomoribot-db
    env_file: .env
    environment:
      # Hard-coded for Docker - users don't need to configure these
      POSTGRES_DB: tomodb
      POSTGRES_USER: tomori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_default_password}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=tomodb
    volumes:
      # Persistent storage - data survives container restarts
      - postgres_data:/var/lib/postgresql/data
      # Initialize pg_cron extension on container startup
      - ./docker/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql:ro
    ports:
      # Publish on host port 15432 for maintenance tools.
      - "15432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomori -d tomodb"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tomori-network
  # SearXNG metasearch server - Tomori's library research assistant
  # Self-hosted JSON aggregator that fronts Google/Bing/DDG/Brave/Wikipedia.
  # Enable with: docker compose --profile searxng up
  # Set SEARXNG_BASE_URL=http://searxng:8080/ in .env when enabling this profile.
  # See servers/searxng/README.md for configuration + upgrade procedure.
  searxng:
    build:
      context: ./servers/searxng
    container_name: tomoribot-searxng
    profiles:
      - searxng
    tmpfs:
      - /etc/searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-not-for-production}
      SEARXNG_BASE_URL: http://localhost:8080/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - tomori-network

  # Crawl4AI URL-fetch server - optional browser-rendered markdown fetcher.
  # Enable with: docker compose --profile fetch-crawl4ai up
  # Set CRAWL4AI_BASE_URL=http://crawl4ai:11235/ and CRAWL4AI_TOKEN in .env to let TomoriBot use it.
  crawl4ai:
    # Pinned: 0.9.4 requires an API token for any non-loopback bind and blocks non-global browser destinations.
    image: unclecode/crawl4ai:0.9.4
    container_name: tomoribot-crawl4ai
    profiles:
      - fetch-crawl4ai
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN:-}
    shm_size: "3gb"
    # TomoriBot reaches the crawler over tomori-network; this host port is for local debugging only.
    ports:
      - "127.0.0.1:11235:11235"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11235/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks:
      - tomori-network

  # TomoriBot application - the main apartment
  tomoribot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomoribot-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Docker-specific database connection: overrides .env values so the app
      # connects to the compose postgres service instead of localhost or AWS RDS.
      # The app reads individual POSTGRES_* vars, NOT POSTGRES_URL.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: tomori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_default_password}
      POSTGRES_DB: tomodb
      NODE_ENV: development
      # Local HTTP endpoints and .env secrets require development mode in Compose.
      RUN_ENV: development
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tomori-network
    # Optional: Mount logs directory for debugging
    volumes:
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
      # Make Docker backup bundles durable and visible on the host.
      - ./backups:/app/backups:rw
      # Required by backup/restore scripts so Docker bundles include the active config.
      - ./.env:/app/.env:rw

# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local

# Private network for TomoriBot's services
networks:
  tomori-network:
    driver: bridge
